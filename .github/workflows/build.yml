name: Build APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Preparar firma
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KSA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/rel.jks"; P="$KSP"; A="$KSA"
          else
            P=temporal123; A=temp
            keytool -genkeypair -keystore "$RUNNER_TEMP/rel.jks" -storepass $P -keypass $P -alias $A -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CalcCientifica"
            echo "::warning::Sin secrets: firma temporal (no podrás actualizar encima de otra versión)"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/rel.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$P" >> $GITHUB_ENV
          echo "KEY_ALIAS=$A" >> $GITHUB_ENV
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CalcCientifica-APK
          path: app/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/apk/release/*.apk
