const CO={num:x=>[x,0],add:cx.add,sub:cx.sub,mul:cx.mul,div:cx.div,neg:a=>[-a[0],-a[1]],T:a=>a,
pow:(a,b)=>a[0]==0&&a[1]==0?(b[0]==0&&b[1]==0?[1,0]:[0,0]):cx.exp(cx.mul(b,cx.ln(a))),
fn:{sqrt:a=>CO.pow(a,[.5,0]),exp:cx.exp,ln:cx.ln,sin:a=>[Math.sin(a[0])*Math.cosh(a[1]),Math.cos(a[0])*Math.sinh(a[1])],cos:a=>[Math.cos(a[0])*Math.cosh(a[1]),-Math.sin(a[0])*Math.sinh(a[1])],abs:a=>[Math.hypot(...a),0],arg:a=>[Math.atan2(a[1],a[0]),0],conj:a=>[a[0],-a[1]],re:a=>[a[0],0],im:a=>[a[1],0]},
v:{i:[0,1],pi:[Math.PI,0],e:[Math.E,0]}};
function cplx(t){const z=rd(t,CO),a=Math.atan2(z[1],z[0]);return'Rect: '+cs(z[0],z[1])+'\nPolar: '+cs(Math.hypot(...z),0)+' ∠ '+cs(deg?a*180/Math.PI:a,0)+(deg?'°':' rad')}
const isM=Array.isArray,mm=(a,b,f)=>a.map((r,i)=>r.map((x,j)=>f(x,b[i][j]))),mT=a=>a[0].map((_,j)=>a.map(r=>r[j])),mI=n=>[...Array(n)].map((_,i)=>[...Array(n)].map((_,j)=>+(i==j))),
mMul=(a,b)=>a.map(r=>b[0].map((_,j)=>r.reduce((s,x,k)=>s+x*b[k][j],0))),
mInv=a=>{const g=gj(a.map((r,i)=>[...r,...mI(a.length)[i]]));if(!g.M)throw 0;return g.M.map(r=>r.slice(a.length))},
mDet=a=>gj(a.map((r,i)=>[...r,...mI(a.length)[i]])).det,sc=(a,f)=>a.map(r=>r.map(f));
const MO={num:x=>x,add:(a,b)=>isM(a)&&isM(b)?mm(a,b,(x,y)=>x+y):a+b,sub:(a,b)=>isM(a)&&isM(b)?mm(a,b,(x,y)=>x-y):a-b,
mul:(a,b)=>isM(a)&&isM(b)?mMul(a,b):isM(a)?sc(a,x=>x*b):isM(b)?sc(b,x=>x*a):a*b,
div:(a,b)=>isM(b)?mMul(a,mInv(b)):isM(a)?sc(a,x=>x/b):a/b,neg:a=>isM(a)?sc(a,x=>-x):-a,T:a=>isM(a)?mT(a):a,
pow:(a,n)=>{if(!isM(a))return Math.pow(a,n);const B=n<0?mInv(a):a;let R=mI(a.length);for(let k=0;k<Math.abs(n);k++)R=mMul(R,B);return R},
fn:{det:mDet,inv:mInv,tr:a=>a.reduce((s,r,i)=>s+r[i],0),T:mT},v:{}};
function matop(t){const L=t.split('\n').map(l=>l.trim()).filter(Boolean);MO.v={};let e=null;
L.forEach(l=>{const m=/^([A-Z])\s*=\s*(.+)$/.exec(l);if(m&&/^[\d\s.;,-]+$/.test(m[2]))MO.v[m[1]]=mat(m[2]);else e=l});
const r=rd(e||Object.keys(MO.v).pop(),MO);return isM(r)?r.map(x=>x.map(fmt).join('   ')).join('\n'):fmt(r)}
/* Gráfica: raíces, intersecciones, extremos, tabla */
function zeros(f){const r=cv.getBoundingClientRect(),a=G.cx-r.width/2/G.sc,b=G.cx+r.width/2/G.sc,N=2000,o=[];let px=a,py=f(a);for(let i=1;i<=N&&o.length<10;i++){const x=a+(b-a)*i/N,y=f(x);if(isFinite(py)&&isFinite(y)&&py*y<=0&&py!=y){let l=px,h=x;for(let j=0;j<60;j++){const m=(l+h)/2;f(l)*f(m)<=0?h=m:l=m}const z=(l+h)/2;if(Math.abs(f(z))<1e-3)o.push(z)}px=x;py=y}return o}
const gi=t=>$('gi').textContent=t;
$('zr').onclick=()=>{const f=fns()[0];if(!f)return;const z=zeros(f);gi(z.length?'Raíces de y1:\n'+z.map(v=>'x = '+fmt(v)).join('\n'):'Sin raíces visibles')};
$('ix').onclick=()=>{const[f,g]=fns();if(!f||!g)return gi('Necesitas y1 e y2');const z=zeros(x=>f(x)-g(x));gi(z.length?'y1 = y2 en:\n'+z.map(v=>'('+fmt(v)+', '+fmt(f(v))+')').join('\n'):'Sin intersecciones visibles')};
$('ex2').onclick=()=>{const f=fns()[0];if(!f)return;const z=zeros(x=>S.der(f,x));gi(z.length?'Extremos de y1:\n'+z.map(v=>(S.der(x=>S.der(f,x),v)>0?'mín ':'máx ')+'('+fmt(v)+', '+fmt(f(v))+')').join('\n'):'Sin extremos visibles')};
$('tb').onclick=()=>{const F=fns(),r=cv.getBoundingClientRect(),raw=80/G.sc,p=10**Math.floor(Math.log10(raw)),st=raw/p<2?p:raw/p<5?2*p:5*p,x0=Math.ceil((G.cx-r.width/2/G.sc)/st)*st;
let o='x\t'+F.map((f,i)=>f?'y'+(i+1):'').join('\t');for(let k=0;k<14;k++){const x=x0+k*st;o+='\n'+fmt(+x.toFixed(10))+'\t'+F.map(f=>f?(()=>{try{return fmt(f(x))}catch(e){return'Error'}})():'').join('\t')}gi(o)}
